<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Pacote da atualização baixando, com selo de assinatura verificada">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E3E7E1" stroke-width="1"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="#F7F7F3"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <g fill="#20272C">
    <path d="M110 80H196V104H134V166H110Z"/>
    <path d="M1170 80H1084V104H1146V166H1170Z"/>
    <path d="M110 640H196V616H134V554H110Z"/>
    <path d="M1170 640H1084V616H1146V554H1170Z"/>
  </g>

  <!-- Release on the left: stacked packages -->
  <g transform="translate(250 230)">
    <rect x="0" y="150" width="200" height="74" rx="10" fill="#E9ECE7" stroke="#D8DED7" stroke-width="2"/>
    <rect x="16" y="80" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#D8DED7" stroke-width="2"/>
    <rect x="32" y="10" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#20272C" stroke-width="2.5"/>
    <rect x="52" y="34" width="26" height="26" rx="6" fill="#20272C"/>
    <rect x="92" y="36" width="110" height="10" rx="3" fill="#20272C"/>
    <rect x="92" y="52" width="70" height="8" rx="3" fill="#C9CFC8"/>
    <rect x="36" y="104" width="26" height="26" rx="6" fill="#C9CFC8"/>
    <rect x="76" y="106" width="110" height="10" rx="3" fill="#C9CFC8"/>
    <rect x="76" y="122" width="70" height="8" rx="3" fill="#E3E7E1"/>
  </g>

  <!-- Transfer -->
  <path d="M500 352H640" stroke="#20272C" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 18"/>
  <path d="M630 334L652 352L630 370" fill="none" stroke="#20272C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Download ring around the app mark -->
  <circle cx="830" cy="352" r="148" fill="#FFFFFF" stroke="#D8DED7" stroke-width="2"/>
  <circle cx="830" cy="352" r="120" fill="none" stroke="#E9ECE7" stroke-width="16"/>
  <path d="M830 232A120 120 0 1 1 726 412" fill="none" stroke="#20272C" stroke-width="16" stroke-linecap="round"/>
  <g transform="translate(780 302)">
    <g fill="#20272C"><path d="M9 9H42V23H23V42H9Z"/><path d="M58 9H91V42H77V23H58Z"/><path d="M9 58H23V77H42V91H9Z"/><path d="M77 58H91V91H58V77H77Z"/></g>
    <circle cx="50" cy="50" r="11" fill="#F25A3C"/>
  </g>

  <!-- Verified signature seal -->
  <g transform="translate(940 450)">
    <circle r="46" fill="#1E7B4F" stroke="#F7F7F3" stroke-width="8"/>
    <path d="M-20 1L-6 15L21 -14" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
