<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Instalação pela imagem de disco no Mac e um laboratório de computadores com o ATUS">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2B3439" stroke-width="1"/></pattern>
    <g id="mark">
      <g fill="#20272C"><path d="M9 9H42V23H23V42H9Z"/><path d="M58 9H91V42H77V23H58Z"/><path d="M9 58H23V77H42V91H9Z"/><path d="M77 58H91V91H58V77H77Z"/></g>
      <circle cx="50" cy="50" r="11" fill="#F25A3C"/>
    </g>
    <g id="monitor">
      <rect width="150" height="100" rx="9" fill="#3A444A"/>
      <rect x="7" y="7" width="136" height="86" rx="4" fill="#F7F7F3"/>
      <use href="#mark" transform="translate(53 28) scale(.44)"/>
      <rect x="66" y="100" width="18" height="18" fill="#3A444A"/>
      <rect x="46" y="116" width="58" height="7" rx="3" fill="#3A444A"/>
    </g>
  </defs>
  <rect width="1280" height="720" fill="#20272C"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <g fill="#F7F7F3">
    <path d="M110 80H196V104H134V166H110Z"/>
    <path d="M1170 80H1084V104H1146V166H1170Z"/>
    <path d="M110 640H196V616H134V554H110Z"/>
    <path d="M1170 640H1084V616H1146V554H1170Z"/>
  </g>

  <!-- Disk image window: drag the app to Applications -->
  <rect x="196" y="216" width="420" height="290" rx="16" fill="#000000" opacity=".25" transform="translate(10 14)"/>
  <rect x="196" y="216" width="420" height="290" rx="16" fill="#F7F7F3"/>
  <path d="M212 216H600A16 16 0 0 1 616 232V258H196V232A16 16 0 0 1 212 216Z" fill="#E6E9E4"/>
  <g fill="#C9CFC8"><circle cx="220" cy="237" r="6.5"/><circle cx="241" cy="237" r="6.5"/><circle cx="262" cy="237" r="6.5"/></g>
  <rect x="244" y="310" width="112" height="112" rx="26" fill="#FFFFFF" stroke="#D8DED7" stroke-width="2"/>
  <use href="#mark" transform="translate(256 322) scale(.88)"/>
  <rect x="262" y="438" width="76" height="10" rx="3" fill="#AEB8B2"/>
  <path d="M378 366H452" stroke="#20272C" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
  <path d="M446 350L466 366L446 382" fill="none" stroke="#20272C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M484 322H526L540 336H582A8 8 0 0 1 590 344V414A8 8 0 0 1 582 422H484A8 8 0 0 1 476 414V330A8 8 0 0 1 484 322Z" fill="#AEB8B2"/>
  <path d="M476 350H590V414A8 8 0 0 1 582 422H484A8 8 0 0 1 476 414Z" fill="#C9CFC8"/>
  <rect x="498" y="438" width="72" height="10" rx="3" fill="#AEB8B2"/>

  <!-- Lab: two rows of computers -->
  <path d="M664 328H1136M664 518H1136" stroke="#3A444A" stroke-width="6" stroke-linecap="round"/>
  <use href="#monitor" transform="translate(674 210) scale(.92)"/>
  <use href="#monitor" transform="translate(830 210) scale(.92)"/>
  <use href="#monitor" transform="translate(986 210) scale(.92)"/>
  <use href="#monitor" transform="translate(674 400) scale(.92)"/>
  <use href="#monitor" transform="translate(830 400) scale(.92)"/>
  <use href="#monitor" transform="translate(986 400) scale(.92)"/>
