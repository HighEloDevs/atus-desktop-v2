name: Ubuntu DNS diagnostics
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-22:
    runs-on: ubuntu-22.04
    steps:
      - name: Inspect DNS connectivity
        run: |
          cat /etc/resolv.conf
          getent ahostsv4 github.com || true
          getent ahostsv4 archive.ubuntu.com || true
          curl --max-time 15 --fail --silent --show-error --resolve cloudflare-dns.com:443:1.1.1.1 -H 'accept: application/dns-json' 'https://cloudflare-dns.com/dns-query?name=archive.ubuntu.com&type=A' 
  ubuntu-24:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect DNS connectivity
        run: |
          cat /etc/resolv.conf
          getent ahostsv4 github.com || true
          getent ahostsv4 archive.ubuntu.com || true
          curl --max-time 15 --fail --silent --show-error --resolve cloudflare-dns.com:443:1.1.1.1 -H 'accept: application/dns-json' 'https://cloudflare-dns.com/dns-query?name=archive.ubuntu.com&type=A' 
