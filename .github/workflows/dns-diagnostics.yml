name: Ubuntu DNS diagnostics
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-22:
    runs-on: ubuntu-22.04
    steps:
      - run: getent ahostsv4 archive.ubuntu.com && getent ahostsv4 security.ubuntu.com
  ubuntu-24:
    runs-on: ubuntu-24.04
    steps:
      - run: getent ahostsv4 archive.ubuntu.com && getent ahostsv4 security.ubuntu.com
