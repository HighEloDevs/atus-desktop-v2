name: Build desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
            artifact: macos-app
            path: src/desktop/target/release/bundle/macos/atus-desktop-macos.zip
          - os: windows-latest
            bundle: nsis
            artifact: windows-installer
            path: src/desktop/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint
      - name: Check frontend formatting
        working-directory: src/frontend
        run: npm run format:check
      - name: Test Rust and C++ bridge
        run: cargo test --manifest-path src/desktop/Cargo.toml
      - name: Build desktop bundle
        working-directory: src/frontend
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src/desktop/target/release/bundle/macos/ATUS Desktop.app" "src/desktop/target/release/bundle/macos/atus-desktop-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
