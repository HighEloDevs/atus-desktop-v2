name: Build desktop

on:
  push:
    branches: [main]

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  check-version:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require up-to-date base and new version
        run: |
          git merge-base --is-ancestor origin/main HEAD
          node .github/scripts/shared/check-version.mjs check --base origin/main

  release-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate version against previous main commit
        run: node .github/scripts/shared/check-version.mjs check --base HEAD^

  integration-macos-intel:
    needs: [check-version, release-version]
    if: ${{ !failure() && !cancelled() && (github.event_name != 'pull_request' || github.base_ref == 'main') }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Require a x86_64 runner
        run: test "$(uname -m)" = x86_64
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src/desktop
          cache-on-failure: true
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Run desktop smoke on macOS Intel
        run: .github/scripts/macos/collect-rust-coverage.sh --no-coverage

  integration-macos-arm64:
    needs: [check-version, release-version]
    if: ${{ !failure() && !cancelled() && (github.event_name != 'pull_request' || github.base_ref == 'main') }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Require a arm64 runner
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src/desktop
          cache-on-failure: true
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Run desktop smoke on macOS Apple Silicon
        run: .github/scripts/macos/collect-rust-coverage.sh --no-coverage

  test-macos-arm64:
    needs: [check-version, release-version]
    if: ${{ !failure() && !cancelled() && (github.event_name != 'pull_request' || github.base_ref == 'main') }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Require a arm64 runner
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src/desktop
          cache-on-failure: true
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Test frontend
        working-directory: src/frontend
        run: npm test
      - name: Verify Rust coverage collector
        run: node --test '.github/tests/scripts/macos/*.test.mjs' '.github/tests/scripts/shared/coverage/*.test.mjs'
      - name: Test Rust and C++ bridge with coverage, including desktop smoke
        run: |
          llvm_bin="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          LLVM_COV="$llvm_bin/llvm-cov" LLVM_PROFDATA="$llvm_bin/llvm-profdata" .github/scripts/macos/collect-rust-coverage.sh "$RUNNER_TEMP/rust.lcov"
          node .github/scripts/shared/coverage/report-uncovered-lines.mjs "$RUNNER_TEMP/rust.lcov"
          node .github/scripts/shared/coverage/check-coverage.mjs "$RUNNER_TEMP/rust.lcov"

  build-macos-arm64:
    needs: [test-macos-arm64, integration-macos-arm64]
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Require a arm64 runner
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src/desktop
          cache-on-failure: true
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Build desktop bundle
        working-directory: src/frontend
        run: npm run tauri -- build --bundles app
      - name: Open packaged macOS application
        run: .github/scripts/macos/smoke-app.sh "src/desktop/target/release/bundle/macos/ATUS Desktop.app"
      - name: Check macOS project document icon
        if: runner.os == 'macOS'
        run: python3 .github/scripts/macos/check-document-icon.py "src/desktop/target/release/bundle/macos/ATUS Desktop.app"
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src/desktop/target/release/bundle/macos/ATUS Desktop.app" "src/desktop/target/release/bundle/macos/atus-desktop-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-app
          path: src/desktop/target/release/bundle/macos/atus-desktop-macos.zip
          if-no-files-found: error
          retention-days: 3

  test-macos-intel:
    needs: [check-version, release-version]
    if: ${{ !failure() && !cancelled() && (github.event_name != 'pull_request' || github.base_ref == 'main') }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Require a x86_64 runner
        run: test "$(uname -m)" = x86_64
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src/desktop
          cache-on-failure: true
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Test frontend
        working-directory: src/frontend
        run: npm test
      - name: Test Rust and C++ bridge
        run: cargo test --manifest-path src/desktop/Cargo.toml

  build-macos-intel:
    needs: [test-macos-intel, integration-macos-intel]
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Require a x86_64 runner
        run: test "$(uname -m)" = x86_64
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src/desktop
          cache-on-failure: true
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Build desktop bundle
        working-directory: src/frontend
        run: npm run tauri -- build --bundles app
      - name: Open packaged macOS application
        run: .github/scripts/macos/smoke-app.sh "src/desktop/target/release/bundle/macos/ATUS Desktop.app"
      - name: Check macOS project document icon
        if: runner.os == 'macOS'
        run: python3 .github/scripts/macos/check-document-icon.py "src/desktop/target/release/bundle/macos/ATUS Desktop.app"
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src/desktop/target/release/bundle/macos/ATUS Desktop.app" "src/desktop/target/release/bundle/macos/atus-desktop-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel-app
          path: src/desktop/target/release/bundle/macos/atus-desktop-macos.zip
          if-no-files-found: error
          retention-days: 3

  integration-windows:
    needs: [check-version, release-version]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src/desktop
          cache-on-failure: true
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Build desktop test application
        run: cargo build --manifest-path src/desktop/Cargo.toml --features desktop-e2e
      - name: Run desktop smoke on Windows
        timeout-minutes: 10
        shell: bash
        run: pwsh -File .github/scripts/windows/run-e2e.ps1

  test-windows:
    needs: [check-version, release-version]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Test checkout line endings
        shell: bash
        run: node --test .github/tests/repo/gitattributes.test.mjs
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src/desktop
          cache-on-failure: true
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Test frontend
        shell: bash
        working-directory: src/frontend
        run: npm test
      - name: Check frontend formatting
        working-directory: src/frontend
        run: npm run format:check
      - name: Test Rust and C++ bridge
        shell: bash
        run: cargo test --manifest-path src/desktop/Cargo.toml

  build-windows:
    needs: [test-windows, integration-windows]
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src/desktop
          cache-on-failure: true
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Build desktop bundle
        working-directory: src/frontend
        run: npm run tauri -- build --bundles nsis
      - name: Check macOS project document icon
        if: runner.os == 'macOS'
        run: python3 .github/scripts/macos/check-document-icon.py "src/desktop/target/release/bundle/macos/ATUS Desktop.app"
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src/desktop/target/release/bundle/macos/ATUS Desktop.app" "src/desktop/target/release/bundle/macos/atus-desktop-macos.zip"
      - name: Install and open Windows package
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src/desktop/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          .github/scripts/windows/smoke-nsis.ps1 -Installer $installers[0].FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src/desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3

  integration-linux:
    needs: [check-version, release-version]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop test dependencies
        timeout-minutes: 15
        run: sudo .github/scripts/linux/install-deps.sh
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src/desktop
          cache-on-failure: true
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Build desktop test application
        run: cargo build --manifest-path src/desktop/Cargo.toml --features desktop-e2e
      - name: Run desktop smoke on Linux
        timeout-minutes: 10
        run: xvfb-run -a .github/scripts/linux/run-e2e.sh

  test-linux:
    needs: [check-version, release-version]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        timeout-minutes: 15
        run: |
          sudo .github/scripts/linux/install-deps.sh
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src/desktop
          cache-on-failure: true
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Test CI helper scripts
        run: node --test '.github/tests/*.test.mjs' '.github/tests/repo/*.test.mjs' '.github/tests/rulesets/*.test.mjs' '.github/tests/workflows/*.test.mjs' '.github/tests/scripts/shared/**/*.test.mjs' '.github/tests/scripts/windows/*.test.mjs'
      - name: Lint, test, and build frontend
        working-directory: src/frontend
        run: |
          npm run lint
          npm run test:coverage
          npm run format:check
          npm run build
      - name: Require frontend line coverage above 90 percent
        run: node .github/scripts/shared/coverage/check-coverage.mjs src/frontend/coverage/lcov.info
      - name: Test Rust and C++ bridge
        run: cargo test --manifest-path src/desktop/Cargo.toml
      - name: Test C++ engine C ABI
        run: |
          cc -std=c11 -Isrc/scientific-engine/include -c src/scientific-engine/tests/mock_analysis_test.c -o /tmp/atus-mock-test.o
          c++ -std=c++17 -Isrc/scientific-engine/include src/scientific-engine/src/mock_analysis.cpp /tmp/atus-mock-test.o -o /tmp/atus-mock-test
          /tmp/atus-mock-test
      - name: Require C++ line coverage above 90 percent
        run: |
          .github/scripts/linux/collect-cpp-coverage.sh /tmp/atus-cpp.lcov
          node .github/scripts/shared/coverage/check-coverage.mjs /tmp/atus-cpp.lcov

  build-linux:
    needs: [test-linux, integration-linux]
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Ubuntu dependency setup
        run: node --test .github/tests/scripts/linux/install-deps.test.mjs
      - name: Install Tauri system dependencies
        timeout-minutes: 15
        run: |
          sudo .github/scripts/linux/install-deps.sh
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src/desktop
          cache-on-failure: true
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Build Linux bundles
        working-directory: src/frontend
        run: |
          npm run tauri -- build --bundles deb,appimage
          # RPM versions cannot contain '-': ship pre-releases as Version 1.2.3 with Release 0.rc.1.
          version="$(node -p "require('../desktop/tauri.conf.json').version")"
          if [[ "$version" == *-* ]]; then
            printf '{"version":"%s","bundle":{"linux":{"rpm":{"release":"0.%s"}}}}\n' "${version%%-*}" "${version#*-}" > "$RUNNER_TEMP/rpm.conf.json"
            npm run tauri -- build --bundles rpm --config "$RUNNER_TEMP/rpm.conf.json"
          else
            npm run tauri -- build --bundles rpm
          fi
      - name: Check Linux bundles
        run: |
          dpkg-deb --info src/desktop/target/release/bundle/deb/*.deb
          rpm -qpi src/desktop/target/release/bundle/rpm/*.rpm
      - name: Install and open Linux bundles in isolated systems
        run: |
          deb=(src/desktop/target/release/bundle/deb/*.deb)
          rpm=(src/desktop/target/release/bundle/rpm/*.rpm)
          appimage=(src/desktop/target/release/bundle/appimage/*.AppImage)
          docker run --rm --dns 1.1.1.1 -v "$PWD:/workspace:ro" ubuntu:22.04 bash /workspace/.github/scripts/linux/smoke-packages.sh deb "/workspace/${deb[0]}"
          docker run --rm --dns 1.1.1.1 -v "$PWD:/workspace:ro" fedora:44 bash /workspace/.github/scripts/linux/smoke-packages.sh rpm "/workspace/${rpm[0]}"
          docker run --rm --dns 1.1.1.1 -v "$PWD:/workspace:ro" ubuntu:22.04 bash /workspace/.github/scripts/linux/smoke-packages.sh appimage "/workspace/${appimage[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src/desktop/target/release/bundle/deb/*.deb
            src/desktop/target/release/bundle/rpm/*.rpm
            src/desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 3

  publish-release:
    needs: [build-linux, build-windows, build-macos-intel, build-macos-arm64]
    # Each build job needs its test and integration jobs, which need release-version, so a successful build implies they passed.
    # Require each result explicitly: failure() and cancelled() ignore a cancelled or skipped dependency.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos-intel.result == 'success' && needs.build-macos-arm64.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: atus-release
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
          pattern: '*-{bundles,installer,app}'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_JSON: ${{ runner.temp }}/run.json
          RELEASE_ARTIFACTS: ${{ runner.temp }}/artifacts
        run: |
          printf '{"head_sha":"%s"}\n' "$GITHUB_SHA" > "$RELEASE_RUN_JSON"
          node .github/scripts/shared/release/publish-release.mjs
