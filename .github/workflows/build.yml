name: Build desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-version:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require up-to-date base and new version
        run: |
          git merge-base --is-ancestor origin/main HEAD
          node .github/scripts/version.mjs check --base origin/main

  test-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Test CI helper scripts
        run: node --test .github/scripts/tests/workflow-jobs.test.mjs .github/scripts/tests/version.test.mjs .github/scripts/tests/release.test.mjs .github/scripts/tests/git-attributes.test.mjs .github/scripts/coverage/check.test.mjs
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint
      - name: Test frontend
        working-directory: src/frontend
        run: npm test
      - name: Check frontend formatting
        working-directory: src/frontend
        run: npm run format:check
      - name: Test Rust and C++ bridge
        run: cargo test --manifest-path src/desktop/Cargo.toml

  build-macos-arm64:
    needs: test-macos-arm64
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Build desktop bundle
        working-directory: src/frontend
        run: npm run tauri -- build --bundles app
      - name: Check macOS project document icon
        if: runner.os == 'macOS'
        run: python3 .github/scripts/tests/check_macos_document_icon.py "src/desktop/target/release/bundle/macos/ATUS Desktop.app"
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src/desktop/target/release/bundle/macos/ATUS Desktop.app" "src/desktop/target/release/bundle/macos/atus-desktop-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-app
          path: src/desktop/target/release/bundle/macos/atus-desktop-macos.zip
          if-no-files-found: error
          retention-days: 3


  test-macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Test CI helper scripts
        run: node --test .github/scripts/tests/workflow-jobs.test.mjs .github/scripts/tests/version.test.mjs .github/scripts/tests/release.test.mjs .github/scripts/tests/git-attributes.test.mjs .github/scripts/coverage/check.test.mjs
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint
      - name: Test frontend
        working-directory: src/frontend
        run: npm test
      - name: Check frontend formatting
        working-directory: src/frontend
        run: npm run format:check
      - name: Test Rust and C++ bridge
        run: cargo test --manifest-path src/desktop/Cargo.toml

  build-macos-intel:
    needs: test-macos-intel
    if: github.event_name != 'pull_request'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Build desktop bundle
        working-directory: src/frontend
        run: npm run tauri -- build --bundles app
      - name: Check macOS project document icon
        if: runner.os == 'macOS'
        run: python3 .github/scripts/tests/check_macos_document_icon.py "src/desktop/target/release/bundle/macos/ATUS Desktop.app"
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src/desktop/target/release/bundle/macos/ATUS Desktop.app" "src/desktop/target/release/bundle/macos/atus-desktop-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel-app
          path: src/desktop/target/release/bundle/macos/atus-desktop-macos.zip
          if-no-files-found: error
          retention-days: 3


  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Test CI helper scripts
        run: node --test .github/scripts/tests/workflow-jobs.test.mjs .github/scripts/tests/version.test.mjs .github/scripts/tests/release.test.mjs .github/scripts/tests/git-attributes.test.mjs .github/scripts/coverage/check.test.mjs
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint
      - name: Test frontend
        working-directory: src/frontend
        run: npm test
      - name: Check frontend formatting
        working-directory: src/frontend
        run: npm run format:check
      - name: Test Rust and C++ bridge
        run: cargo test --manifest-path src/desktop/Cargo.toml

  build-windows:
    needs: test-windows
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Build desktop bundle
        working-directory: src/frontend
        run: npm run tauri -- build --bundles nsis
      - name: Check macOS project document icon
        if: runner.os == 'macOS'
        run: python3 .github/scripts/tests/check_macos_document_icon.py "src/desktop/target/release/bundle/macos/ATUS Desktop.app"
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src/desktop/target/release/bundle/macos/ATUS Desktop.app" "src/desktop/target/release/bundle/macos/atus-desktop-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src/desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3


  test-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Ubuntu dependency setup
        run: node --test .github/scripts/tests/ubuntu-deps.test.mjs
      - name: Install Tauri system dependencies
        timeout-minutes: 15
        run: |
          sudo .github/scripts/ci/install-ubuntu-deps.sh
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Test CI helper scripts
        run: node --test .github/scripts/tests/workflow-jobs.test.mjs .github/scripts/tests/version.test.mjs .github/scripts/tests/release.test.mjs .github/scripts/tests/git-attributes.test.mjs .github/scripts/coverage/check.test.mjs
      - name: Lint, test, and build frontend
        working-directory: src/frontend
        run: |
          npm run lint
          npm run test:coverage
          npm run format:check
          npm run build
      - name: Require frontend line coverage above 90 percent
        run: node .github/scripts/coverage/check.mjs src/frontend/coverage/lcov.info
      - name: Test Rust and C++ bridge
        run: cargo test --manifest-path src/desktop/Cargo.toml
      - name: Test C++ engine C ABI
        run: |
          cc -std=c11 -Isrc/scientific-engine/include -c src/scientific-engine/tests/mock_analysis_test.c -o /tmp/atus-mock-test.o
          c++ -std=c++17 -Isrc/scientific-engine/include src/scientific-engine/src/mock_analysis.cpp /tmp/atus-mock-test.o -o /tmp/atus-mock-test
          /tmp/atus-mock-test
      - name: Require C++ line coverage above 90 percent
        run: |
          .github/scripts/coverage/cpp-llvm.sh /tmp/atus-cpp.lcov
          node .github/scripts/coverage/check.mjs /tmp/atus-cpp.lcov

  build-linux:
    needs: test-linux
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Ubuntu dependency setup
        run: node --test .github/scripts/tests/ubuntu-deps.test.mjs
      - name: Install Tauri system dependencies
        timeout-minutes: 15
        run: |
          sudo .github/scripts/ci/install-ubuntu-deps.sh
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Test Linux bundle verifier
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_verify_linux_bundles.py'
      - name: Build Linux bundles
        working-directory: src/frontend
        run: npm run tauri -- build --bundles deb,rpm,appimage
      - name: Check Linux bundles
        run: |
          python3 .github/scripts/verify-linux-bundles.py src/desktop/target/release/bundle
          dpkg-deb --info src/desktop/target/release/bundle/deb/*.deb
          rpm -qpi src/desktop/target/release/bundle/rpm/*.rpm
      - name: Test isolated package smoke script
        run: node --test .github/scripts/tests/linux-smoke.test.mjs
      - name: Install and open Linux bundles in isolated systems
        run: |
          deb=(src/desktop/target/release/bundle/deb/*.deb)
          rpm=(src/desktop/target/release/bundle/rpm/*.rpm)
          appimage=(src/desktop/target/release/bundle/appimage/*.AppImage)
          docker run --rm --dns 1.1.1.1 -v "$PWD:/workspace:ro" ubuntu:22.04 bash /workspace/.github/scripts/ci/smoke-linux-container.sh deb "/workspace/${deb[0]}"
          docker run --rm --dns 1.1.1.1 -v "$PWD:/workspace:ro" fedora:44 bash /workspace/.github/scripts/ci/smoke-linux-container.sh rpm "/workspace/${rpm[0]}"
          docker run --rm --dns 1.1.1.1 -v "$PWD:/workspace:ro" ubuntu:22.04 bash /workspace/.github/scripts/ci/smoke-linux-container.sh appimage "/workspace/${appimage[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src/desktop/target/release/bundle/deb/*.deb
            src/desktop/target/release/bundle/rpm/*.rpm
            src/desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 3
