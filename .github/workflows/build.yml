name: Build desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require up-to-date base and new version
        run: |
          git merge-base --is-ancestor origin/main HEAD
          node scripts/version.mjs check --base origin/main

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
            artifact: macos-arm64-app
            path: src/desktop/target/release/bundle/macos/atus-desktop-macos.zip
          - os: macos-15-intel
            bundle: app
            artifact: macos-intel-app
            path: src/desktop/target/release/bundle/macos/atus-desktop-macos.zip
          - os: windows-latest
            bundle: nsis
            artifact: windows-installer
            path: src/desktop/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Test CI helper scripts
        run: node --test scripts/tests/version.test.mjs scripts/tests/release.test.mjs scripts/tests/git-attributes.test.mjs scripts/coverage/check.test.mjs
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint
      - name: Test frontend
        working-directory: src/frontend
        run: npm test
      - name: Check frontend formatting
        working-directory: src/frontend
        run: npm run format:check
      - name: Test Rust and C++ bridge
        run: cargo test --manifest-path src/desktop/Cargo.toml
      - name: Build desktop bundle
        working-directory: src/frontend
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Check macOS project document icon
        if: runner.os == 'macOS'
        run: python3 src/desktop/tests/check_macos_document_icon.py "src/desktop/target/release/bundle/macos/ATUS Desktop.app"
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src/desktop/target/release/bundle/macos/ATUS Desktop.app" "src/desktop/target/release/bundle/macos/atus-desktop-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 3

  linux-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential clang llvm curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 rpm
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Test CI helper scripts
        run: node --test scripts/tests/version.test.mjs scripts/tests/release.test.mjs scripts/tests/git-attributes.test.mjs scripts/coverage/check.test.mjs
      - name: Lint, test, and build frontend
        working-directory: src/frontend
        run: |
          npm run lint
          npm run test:coverage
          npm run format:check
          npm run build
      - name: Require frontend line coverage above 90 percent
        run: node scripts/coverage/check.mjs src/frontend/coverage/lcov.info
      - name: Test Rust and C++ bridge
        run: cargo test --manifest-path src/desktop/Cargo.toml
      - name: Test C++ engine C ABI
        run: |
          cc -std=c11 -Isrc/scientific-engine/include -c src/scientific-engine/tests/mock_analysis_test.c -o /tmp/atus-mock-test.o
          c++ -std=c++17 -Isrc/scientific-engine/include src/scientific-engine/src/mock_analysis.cpp /tmp/atus-mock-test.o -o /tmp/atus-mock-test
          /tmp/atus-mock-test
      - name: Require C++ line coverage above 90 percent
        run: |
          scripts/coverage/cpp-llvm.sh /tmp/atus-cpp.lcov
          node scripts/coverage/check.mjs /tmp/atus-cpp.lcov
      - name: Test Linux bundle verifier
        run: python3 -m unittest discover -s scripts/tests -p 'test_verify_linux_bundles.py'
      - name: Build Linux bundles
        working-directory: src/frontend
        run: npm run tauri -- build --bundles deb,rpm,appimage
      - name: Check Linux bundles
        run: |
          python3 scripts/verify-linux-bundles.py src/desktop/target/release/bundle
          dpkg-deb --info src/desktop/target/release/bundle/deb/*.deb
          rpm -qpi src/desktop/target/release/bundle/rpm/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src/desktop/target/release/bundle/deb/*.deb
            src/desktop/target/release/bundle/rpm/*.rpm
            src/desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 3
