name: Upload test logs
description: Keep the recorded test output of this job for one day so the summary job can read it.
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v4
      with:
        name: results-${{ github.job }}
        path: ${{ runner.temp }}/test-logs
        if-no-files-found: ignore
        retention-days: 1
