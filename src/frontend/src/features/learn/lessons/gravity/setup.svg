<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Montagem do faiscador: o ovinho cai entre dois fios ligados a um gerador de alta tensão sincronizado com a rede; a cada 1/60 s uma faísca passa pelo anel do ovinho e marca um ponto na fita de papel encerado">
<defs>
  <linearGradient id="ovo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9e4da"/><stop offset=".5" stop-color="#b7ad9b"/><stop offset="1" stop-color="#6d6556"/></linearGradient>
  <linearGradient id="ring" x1="0" x2="1"><stop offset="0" stop-color="#d9dde0"/><stop offset=".5" stop-color="#8d969c"/><stop offset="1" stop-color="#4b5359"/></linearGradient>
  <linearGradient id="acrylic" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#eef4f6"/><stop offset="1" stop-color="#d7e2e6"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>
</defs>
<rect width="640" height="330" fill="#f7f7f3"/>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#20272c">
<rect x="120" y="24" width="120" height="10" rx="2" fill="#20272c"/><rect x="120" y="306" width="120" height="16" rx="3" fill="#cfd5cd" stroke="#aab3a8"/><path d="M150 34V306M210 34V306" stroke="#7c858b" stroke-width="1.6"/><rect x="191" y="34" width="10" height="272" fill="#f3ecd6" stroke="#d6c9a1" stroke-width=".6"/><circle cx="196" cy="62.3" r="1.3" fill="#20272c"/><circle cx="196" cy="62.9" r="1.3" fill="#20272c"/><circle cx="196" cy="63.8" r="1.3" fill="#20272c"/><circle cx="196" cy="65.1" r="1.3" fill="#20272c"/><circle cx="196" cy="66.7" r="1.3" fill="#20272c"/><circle cx="196" cy="68.7" r="1.3" fill="#20272c"/><circle cx="196" cy="71.0" r="1.3" fill="#20272c"/><circle cx="196" cy="73.6" r="1.3" fill="#20272c"/><circle cx="196" cy="76.6" r="1.3" fill="#20272c"/><circle cx="196" cy="79.9" r="1.3" fill="#20272c"/><circle cx="196" cy="83.6" r="1.3" fill="#20272c"/><circle cx="196" cy="87.6" r="1.3" fill="#20272c"/><circle cx="196" cy="91.9" r="1.3" fill="#20272c"/><circle cx="196" cy="96.6" r="1.3" fill="#20272c"/><circle cx="196" cy="101.6" r="1.3" fill="#20272c"/><circle cx="196" cy="107.0" r="1.3" fill="#20272c"/><circle cx="196" cy="112.7" r="1.3" fill="#20272c"/><circle cx="196" cy="118.7" r="1.3" fill="#20272c"/><circle cx="196" cy="125.1" r="1.3" fill="#20272c"/><circle cx="196" cy="131.8" r="1.3" fill="#20272c"/><circle cx="196" cy="138.8" r="1.3" fill="#20272c"/><circle cx="196" cy="146.2" r="1.3" fill="#20272c"/><circle cx="196" cy="154.0" r="1.3" fill="#20272c"/><circle cx="196" cy="162.0" r="1.3" fill="#20272c"/><circle cx="196" cy="170.4" r="1.3" fill="#20272c"/><circle cx="196" cy="179.2" r="1.3" fill="#20272c"/><g ><ellipse cx="180" cy="196" rx="11" ry="16" fill="url(#ovo)" stroke="#20272c" stroke-width=".6"/><rect x="167" y="194" width="26" height="4" rx="1.5" fill="url(#ring)" stroke="#20272c" stroke-width=".4"/></g><path d="M210 195l-6 3l-4 -3l-3 2M167 196l-5 -2l-5 3l-7 -1" stroke="#f25a3c" stroke-width="1.4" fill="none"/><path d="M180 218V292" stroke="#364cff" stroke-width="1.2" stroke-dasharray="3 4" marker-end="url(#arrow)"/><rect x="20" y="132" width="86" height="58" rx="6" fill="#fff" stroke="#20272c"/><text x="63" y="152" text-anchor="middle" font-size="10">gerador de</text><text x="63" y="165" text-anchor="middle" font-size="10">alta tensão</text><text x="63" y="180" text-anchor="middle" font-size="10" fill="#f25a3c" font-weight="600">60 Hz</text><path d="M106 150H150M106 172H128V302H210" stroke="#20272c" stroke-width=".8" fill="none"/><path d="M63 190V232" stroke="#20272c" stroke-width=".8"/><rect x="50" y="232" width="26" height="14" rx="2" fill="#20272c"/><text x="63" y="262" text-anchor="middle" fill="#66716e" font-size="10">tomada</text><path d="M214 70H244M202 110H244M193 186L244 160M216 196L244 214" stroke="#66716e" stroke-width=".6"/><text x="250" y="74" >dois fios verticais, ligados ao gerador</text><text x="250" y="114" >fita de papel encerado, entre o ovinho e um fio</text><text x="250" y="128" fill="#66716e">cada faísca deixa um ponto queimado</text><text x="250" y="164" >ovinho (84 g) com um anel metálico</text><text x="250" y="178" fill="#66716e">o anel conduz a faísca de um fio ao outro</text><text x="250" y="218" fill="#f25a3c" font-weight="600">faísca a cada ciclo da rede elétrica:</text><text x="250" y="232" fill="#f25a3c">uma marca a cada 1/60 s</text><text x="250" y="270" fill="#66716e">O tempo vem da rede elétrica; as posições vêm</text><text x="250" y="284" fill="#66716e">da fita, lida depois com uma régua.</text>
</g>
</svg>
